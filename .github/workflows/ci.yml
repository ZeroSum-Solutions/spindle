name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks git . --redact --exit-code 1 --no-banner
          rm gitleaks
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        run: pnpm check
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,realtime,postgres-meta,supavisor
      - name: Database policy tests
        run: supabase test db
      - name: Export local Supabase settings
        run: |
          supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            | grep '^NEXT_PUBLIC_' | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Owner race test
        run: |
          supabase/tests/race/owner-race-guard.test.sh
          supabase/tests/race/owner-race.sh
      - name: Content publishing race test
        run: |
          supabase/tests/race/content-publishing-race-proc.test.sh
          supabase/tests/race/content-publishing-race.sh
      - name: End-to-end tests (production build)
        # The local stack's service key exists only in this step's shell, for test
        # setup and cleanup; it is never exported to $GITHUB_ENV or the app.
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          SPINDLE_TEST_SERVICE_ROLE_KEY="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          test -n "$SPINDLE_TEST_SERVICE_ROLE_KEY"
          echo "::add-mask::$SPINDLE_TEST_SERVICE_ROLE_KEY"
          SPINDLE_TEST_SERVICE_ROLE_KEY="$SPINDLE_TEST_SERVICE_ROLE_KEY" pnpm --filter web e2e
